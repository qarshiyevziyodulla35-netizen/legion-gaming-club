<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <div id="loginScreen">
      <h1 class="display" style="font-size:22px;margin:0 0 4px;">🔒 Admin panel</h1>
      <p style="color:var(--text-muted);font-size:13px;margin:0 0 18px;">Kirish uchun parolni kiriting</p>
      <label>Parol</label>
      <input type="password" id="passwordInput" placeholder="Parol">
      <button class="submit-btn" onclick="tryLogin()">Kirish</button>
      <div id="loginError"></div>
    </div>

    <div id="mainScreen" style="display:none;">
      <h1 class="display" style="font-size:22px;margin:0 0 4px;">📋 Admin panel</h1>
      <p style="color:var(--text-muted);font-size:13px;margin:0 0 18px;">Buyurtmalar, moliya va oflayn bandlik</p>

      <div class="section-title"><h2>💰 Moliya</h2></div>
      <div id="statsBox" class="price-box">Yuklanmoqda...</div>

      <div class="section-title"><h2>➕ Oflayn bandlik qo'shish</h2></div>
      <p style="color:var(--text-muted);font-size:12px;margin:0 0 10px;">Joyida (naqd/karta) to'lagan mijozni shu yerdan kiriting — avtomatik tasdiqlangan hisoblanadi</p>

      <label>Turi</label>
      <select id="offKind">
        <option value="club">🏢 Klub</option>
        <option value="rental">🏠 Ijara</option>
      </select>

      <label>Konsol</label>
      <select id="offConsole"></select>

      <label>Sana</label>
      <input type="date" id="offDate">

      <label>Boshlanish vaqti</label>
      <select id="offStartHour"></select>

      <label id="offHoursLabel">Necha soat</label>
      <select id="offHours">
        <option value="1">1 soat</option>
        <option value="2">2 soat</option>
        <option value="3">3 soat</option>
        <option value="4">4 soat</option>
      </select>

      <div id="offAddressWrap" style="display:none;">
        <label>Manzil</label>
        <input type="text" id="offAddress" placeholder="Manzil">
      </div>

      <label>Telefon (ixtiyoriy)</label>
      <input type="tel" id="offPhone" placeholder="+998 90 123 45 67">

      <label>Qabul qilingan summa (ixtiyoriy, bo'sh qoldirsangiz standart narx olinadi)</label>
      <input type="number" id="offPaidAmount" placeholder="masalan: 35000">

      <button class="submit-btn" onclick="submitOffline()">Qo'shish</button>
      <div id="offResult"></div>

      <div class="section-title"><h2>🧾 Barcha buyurtmalar</h2></div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="filter-btn active" data-filter="all">Hammasi</button>
        <button class="filter-btn" data-filter="club">🏢 Klub</button>
        <button class="filter-btn" data-filter="rental">🏠 Ijara</button>
      </div>

      <div id="list"><div class="empty-state">Yuklanmoqda...</div></div>
    </div>
  </div>

  <style>
    .filter-btn {
      flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text-muted); font-size: 13px; font-family: 'Inter', sans-serif;
    }
    .filter-btn.active { background: var(--gold); color: #2a0f16; font-weight: 600; border-color: transparent; }
    .source-tag {
      display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 8px; margin-left: 6px;
    }
    .source-tag.online { background: rgba(80,160,255,0.15); color: #8fc6ff; }
    .source-tag.offline { background: rgba(242,161,84,0.15); color: var(--gold-soft); }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let adminPassword = '';
    try { adminPassword = sessionStorage.getItem('adminPassword') || ''; } catch (e) {}

    const statusLabels = {
      awaiting_payment: "To'lov kutilmoqda",
      confirmed: "Tasdiqlangan",
      cancelled: "Bekor qilingan",
      expired: "Muddati o'tgan"
    };

    async function tryLogin() {
      const pass = document.getElementById('passwordInput').value;
      const errEl = document.getElementById('loginError');
      const res = await fetch('/api/check-access?password=' + encodeURIComponent(pass));
      const data = res.status !== 403 ? await res.json() : null;
      if (!data || data.role !== 'admin') {
        errEl.className = 'result-box error';
        errEl.innerHTML = "❌ Parol noto'g'ri yoki bu faqat xodim paroli (to'liq panel uchun admin parol kerak)";
        return;
      }
      adminPassword = pass;
      try { sessionStorage.setItem('adminPassword', pass); } catch (e) {}
      showMain();
    }

    function showMain() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';
      loadStats();
      loadOrders();
    }

    // Agar oldin kirilgan bo'lsa, qayta parol so'ramaydi
    if (adminPassword) {
      fetch('/api/check-access?password=' + encodeURIComponent(adminPassword)).then(async res => {
        if (res.status === 403) return;
        const d = await res.json();
        if (d.role === 'admin') showMain();
      });
    }

    // ---------- Moliya ----------
    async function loadStats() {
      const box = document.getElementById('statsBox');
      const res = await fetch('/api/stats?password=' + encodeURIComponent(adminPassword));
      if (res.status === 403) { box.textContent = 'Kirish huquqi yo\'q'; return; }
      const s = await res.json();
      box.innerHTML = `
        <div class="row"><span>🏢 Klub daromadi</span><span>${s.clubRevenue.toLocaleString()} so'm</span></div>
        <div class="row"><span>🏠 Ijara daromadi</span><span>${s.rentalRevenue.toLocaleString()} so'm</span></div>
        <div class="row" style="margin-top:6px;"><span>💻 Onlayn</span><span>${s.onlineRevenue.toLocaleString()} so'm</span></div>
        <div class="row"><span>🧾 Oflayn</span><span>${s.offlineRevenue.toLocaleString()} so'm</span></div>
        <div class="row total"><span>Jami daromad</span><span>${s.totalRevenue.toLocaleString()} so'm</span></div>
        <div class="row" style="margin-top:8px;"><span>Klub: ${s.clubConfirmed}/${s.clubBookingsTotal}</span><span>Ijara: ${s.rentalConfirmed}/${s.rentalOrdersTotal}</span></div>
        <div class="row"><span>To'lov kutilmoqda</span><span>${s.awaitingPayment} ta</span></div>
      `;
    }

    // ---------- Oflayn qo'shish formasi ----------
    const offStartHourSel = document.getElementById('offStartHour');
    for (let h = 9; h <= 22; h++) {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h + ':00';
      offStartHourSel.appendChild(opt);
    }
    document.getElementById('offDate').valueAsDate = new Date();

    function updateOfflineFormForKind() {
      const kind = document.getElementById('offKind').value;
      const consoleSel = document.getElementById('offConsole');
      consoleSel.innerHTML = '';
      const count = kind === 'club' ? 4 : 2;
      for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = 'Konsol ' + i;
        consoleSel.appendChild(opt);
      }
      document.getElementById('offAddressWrap').style.display = kind === 'rental' ? 'block' : 'none';
      document.getElementById('offHoursLabel').textContent = kind === 'rental' ? 'Necha kun (x24 soat)' : 'Necha soat';
      const hoursSel = document.getElementById('offHours');
      hoursSel.innerHTML = kind === 'rental'
        ? '<option value="24">1 kun</option><option value="48">2 kun</option><option value="72">3 kun</option>'
        : '<option value="1">1 soat</option><option value="2">2 soat</option><option value="3">3 soat</option><option value="4">4 soat</option>';
    }
    document.getElementById('offKind').addEventListener('change', updateOfflineFormForKind);
    updateOfflineFormForKind();

    async function submitOffline() {
      const kind = document.getElementById('offKind').value;
      const consoleId = document.getElementById('offConsole').value;
      const date = document.getElementById('offDate').value;
      const startHour = document.getElementById('offStartHour').value;
      const hours = document.getElementById('offHours').value;
      const address = document.getElementById('offAddress').value;
      const phone = document.getElementById('offPhone').value;
      const paidAmount = document.getElementById('offPaidAmount').value;
      const resultDiv = document.getElementById('offResult');

      const res = await fetch('/api/offline-booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, kind, date, startHour, hours, consoleId, address, phone, paidAmount })
      });
      const data = await res.json();
      if (data.ok) {
        resultDiv.className = 'result-box';
        resultDiv.innerHTML = `✅ Qo'shildi! #${data.booking ? data.booking.id : data.order.id}`;
        loadStats(); loadOrders();
      } else {
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = data.reason === 'console_busy' ? '❌ Bu konsol shu vaqtda band' : '❌ Xatolik: ' + (data.error || data.reason || '');
      }
    }

    // ---------- Buyurtmalar ro'yxati ----------
    let allItems = [];
    let currentFilter = 'all';

    async function loadOrders() {
      const list = document.getElementById('list');
      const res = await fetch('/api/all-orders?password=' + encodeURIComponent(adminPassword));
      if (res.status === 403) {
        list.innerHTML = '<div class="empty-state">Sizda bu panelga kirish huquqi yo\'q</div>';
        return;
      }
      const data = await res.json();
      allItems = [...data.club.map(x => ({...x, kind: 'club'})), ...data.rental.map(x => ({...x, kind: 'rental'}))]
        .sort((a, b) => b.createdAt - a.createdAt);
      render();
    }

    function render() {
      const list = document.getElementById('list');
      const items = currentFilter === 'all' ? allItems : allItems.filter(i => i.kind === currentFilter);
      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Buyurtma topilmadi</div>';
        return;
      }
      list.innerHTML = items.map(o => `
        <div class="order-card">
          <div class="top-row">
            <span class="kind">${o.kind === 'club' ? '🏢 Klub' : '🏠 Ijara'} · #${o.id}<span class="source-tag ${o.source || 'online'}">${(o.source || 'online') === 'offline' ? 'oflayn' : 'onlayn'}</span></span>
            <span class="status ${o.status}">${statusLabels[o.status] || o.status}</span>
          </div>
          <div class="meta">${o.date}, ${o.startHour}:00 · ${o.hours} soat · konsol #${o.consoleId}</div>
          <div class="meta">${o.kind === 'rental' ? (o.address + ' · ') : ''}📞 ${o.phone} · ${o.total.toLocaleString()} so'm</div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });
  </script>
</body>
</html>
