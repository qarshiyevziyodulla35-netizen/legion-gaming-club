<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyurtmalarim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" onclick="return navHash(this)" class="back-link">← Orqaga</a>
    <h1 class="display" style="font-size:22px;margin:0 0 16px;">🧾 Mening buyurtmalarim</h1>

    <div id="list"><div class="empty-state">Yuklanmoqda...</div></div>
    <p id="debugId" style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:10px;"></p>

    <div class="bottom-nav">
      <a href="index.html" onclick="return navHash(this)"><span class="icon">🏠</span>Bosh sahifa</a>
      <a href="club.html" onclick="return navHash(this)"><span class="icon">🏢</span>Klub</a>
      <a href="rental.html" onclick="return navHash(this)"><span class="icon">🚗</span>Ijara</a>
      <a href="orders.html" onclick="return navHash(this)" class="active"><span class="icon">🧾</span>Buyurtmalarim</a>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      tg.BackButton.show();
      tg.BackButton.onClick(() => { window.location.href = 'index.html' + window.location.hash; });
    }

    // Sahifalar orasida o'tganda Telegram foydalanuvchi ma'lumotini (initData) yo'qotmaslik uchun
    function navHash(el) {
      window.location.href = el.getAttribute('href') + window.location.hash;
      return false;
    }
    // Telegram foydalanuvchi ID'sini olish — birinchi marta topilganda saqlab qo'yamiz,
    // keyingi sahifalarda (agar hash orqali kelmasa ham) sessionStorage'dan o'qiymiz
    function getTelegramId() {
      let id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
      try {
        if (id) sessionStorage.setItem('tgId', id);
        else id = sessionStorage.getItem('tgId');
      } catch (e) {}
      return id;
    }
    const telegramId = getTelegramId();
    const debugEl = document.getElementById('debugId');
    if (debugEl) debugEl.textContent = telegramId ? ('ID: ' + telegramId) : 'ID topilmadi';

    const statusLabels = {
      awaiting_payment: "To'lov kutilmoqda",
      confirmed: "Tasdiqlangan",
      cancelled: "Bekor qilingan",
      expired: "Muddati o'tgan"
    };

    async function loadOrders() {
      const list = document.getElementById('list');
      if (!telegramId) {
        list.innerHTML = '<div class="empty-state">Buyurtmalaringizni ko\'rish uchun botni Telegram ichidan oching</div>';
        return;
      }
      const res = await fetch('/api/my-orders?telegramId=' + telegramId);
      const data = await res.json();
      const items = [...data.club.map(x => ({...x, kind: 'club'})), ...data.rental.map(x => ({...x, kind: 'rental'}))]
        .sort((a, b) => b.createdAt - a.createdAt);

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Hali buyurtmangiz yo\'q</div>';
        return;
      }

      list.innerHTML = items.map(o => `
        <div class="order-card">
          <div class="top-row">
            <span class="kind">${o.kind === 'club' ? '🏢 Klub' : '🏠 Ijara'} · #${o.id}</span>
            <span class="status ${o.status}">${statusLabels[o.status] || o.status}</span>
          </div>
          <div class="meta">${o.date}, ${o.startHour}:00 · ${o.hours} soat</div>
          <div class="meta">${o.kind === 'rental' ? o.address + ' · ' : ''}${o.total.toLocaleString()} so'm</div>
        </div>
      `).join('');
    }
    loadOrders();
  </script>
</body>
</html>
