<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyurtmalarim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" onclick="return navHash(this)" class="back-link">← Orqaga</a>
    <h1 class="display" style="font-size:22px;margin:0 0 4px;">🧾 Mening buyurtmalarim</h1>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 16px;">Band qilishda ko'rsatgan telefon raqamingizni kiriting</p>

    <label>Telefon raqam</label>
    <input type="tel" id="phoneInput" placeholder="+998 90 123 45 67">
    <button class="submit-btn" onclick="searchByPhone()">Qidirish</button>

    <div id="list" style="margin-top:20px;"></div>

    <div class="bottom-nav">
      <a href="index.html" onclick="return navHash(this)"><span class="icon">🏠</span>Bosh sahifa</a>
      <a href="club.html" onclick="return navHash(this)"><span class="icon">🏢</span>Klub</a>
      <a href="rental.html" onclick="return navHash(this)"><span class="icon">🚗</span>Ijara</a>
      <a href="orders.html" onclick="return navHash(this)" class="active"><span class="icon">🧾</span>Buyurtmalarim</a>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      tg.BackButton.show();
      tg.BackButton.onClick(() => { window.location.href = 'index.html' + window.location.hash; });
    }

    // Sahifalar orasida o'tganda Telegram foydalanuvchi ma'lumotini (initData) yo'qotmaslik uchun
    function navHash(el) {
      window.location.href = el.getAttribute('href') + window.location.hash;
      return false;
    }

    const statusLabels = {
      awaiting_payment: "To'lov kutilmoqda",
      confirmed: "Tasdiqlangan",
      cancelled: "Bekor qilingan",
      expired: "Muddati o'tgan"
    };

    function renderItems(items) {
      const list = document.getElementById('list');
      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">Bu raqam bo\'yicha buyurtma topilmadi</div>';
        return;
      }
      list.innerHTML = items.map(o => `
        <div class="order-card">
          <div class="top-row">
            <span class="kind">${o.kind === 'club' ? '🏢 Klub' : '🏠 Ijara'} · #${o.id}</span>
            <span class="status ${o.status}">${statusLabels[o.status] || o.status}</span>
          </div>
          <div class="meta">${o.date}, ${o.startHour}:00 · ${o.hours} soat</div>
          <div class="meta">${o.kind === 'rental' ? o.address + ' · ' : ''}${o.total.toLocaleString()} so'm</div>
        </div>
      `).join('');
    }

    async function searchByPhone() {
      const phone = document.getElementById('phoneInput').value;
      const list = document.getElementById('list');
      if (!phone) {
        alert("Iltimos, telefon raqamni kiriting");
        return;
      }
      list.innerHTML = '<div class="empty-state">Qidirilmoqda...</div>';
      const res = await fetch('/api/my-orders-by-phone?phone=' + encodeURIComponent(phone));
      const data = await res.json();
      const items = [...data.club.map(x => ({...x, kind: 'club'})), ...data.rental.map(x => ({...x, kind: 'rental'}))]
        .sort((a, b) => b.createdAt - a.createdAt);
      renderItems(items);
    }

    // Sahifa ochilganda, agar oldin telefon raqam kiritilgan bo'lsa, avtomatik ko'rsatamiz
    try {
      const savedPhone = sessionStorage.getItem('myPhone');
      if (savedPhone) {
        document.getElementById('phoneInput').value = savedPhone;
        searchByPhone();
      }
    } catch (e) {}

    document.getElementById('phoneInput').addEventListener('change', function() {
      try { sessionStorage.setItem('myPhone', this.value); } catch (e) {}
    });
  </script>
</body>
</html>
