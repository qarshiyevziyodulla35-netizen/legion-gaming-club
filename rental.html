<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uyga buyurtma</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" onclick="return navHash(this)" class="back-link">← Orqaga</a>
    <h1 class="display" style="font-size:22px;margin:0 0 4px;">🏠 Uyga buyurtma qilish</h1>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 18px;">Konsolni o'zingiz tanlaysiz</p>

    <label>Manzil</label>
    <input type="text" id="address" placeholder="Shahar, ko'cha, uy raqami">

    <label>Sana</label>
    <input type="date" id="date">

    <label>Konsolni tanlang</label>
    <div id="consoleGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

    <label>Boshlanish vaqti</label>
    <select id="startHour"></select>

    <label>Necha kun</label>
    <select id="days">
      <option value="1">1 kun (24 soat)</option>
      <option value="2">2 kun</option>
      <option value="3">3 kun</option>
      <option value="7">7 kun</option>
    </select>

    <label>Telefon raqam</label>
    <input type="tel" id="phone" placeholder="+998 90 123 45 67">

    <div class="price-box">
      <div class="row"><span>Jami narx</span><span id="totalPrice">-</span></div>
      <div class="row total"><span>Oldindan to'lov (garov, 100%)</span><span id="prepayPrice">-</span></div>
    </div>

    <div class="price-box" style="margin-top:10px;">
      <div class="row"><span>To'lov kartasi</span><span id="cardNumber">yuklanmoqda...</span></div>
    </div>

    <button class="submit-btn" onclick="submitOrder()">Buyurtma berish</button>
    <div id="result"></div>

    <div class="bottom-nav">
      <a href="index.html" onclick="return navHash(this)"><span class="icon">🏠</span>Bosh sahifa</a>
      <a href="club.html" onclick="return navHash(this)"><span class="icon">🏢</span>Klub</a>
      <a href="rental.html" onclick="return navHash(this)" class="active"><span class="icon">🚗</span>Ijara</a>
      <a href="orders.html" onclick="return navHash(this)"><span class="icon">🧾</span>Buyurtmalarim</a>
    </div>
  </div>

  <style>
    .console-card {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }
    .console-card.selected { border-color: var(--gold); background: rgba(242,161,84,0.12); }
    .console-card.busy { opacity: 0.5; cursor: not-allowed; }
    .console-card .n { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .console-card .s { font-size: 11px; color: var(--text-muted); }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      tg.BackButton.show();
      tg.BackButton.onClick(() => { window.location.href = 'index.html' + window.location.hash; });
    }

    function navHash(el) {
      window.location.href = el.getAttribute('href') + window.location.hash;
      return false;
    }
    function getTelegramId() {
      let id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
      try {
        if (id) sessionStorage.setItem('tgId', id);
        else id = sessionStorage.getItem('tgId');
      } catch (e) {}
      return id;
    }

    const DAILY = 300000;
    const startHourSel = document.getElementById('startHour');
    for (let h = 9; h <= 22; h++) {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h + ':00';
      startHourSel.appendChild(opt);
    }
    document.getElementById('date').valueAsDate = new Date();

    let rentalAvailability = []; // [{consoleId, busy}]
    let selectedConsole = null;

    function renderConsoleGrid() {
      const grid = document.getElementById('consoleGrid');
      grid.innerHTML = rentalAvailability.map(c => `
        <div class="console-card ${c.consoleId === selectedConsole ? 'selected' : ''} ${c.busy ? 'busy' : ''}"
             onclick="${c.busy ? '' : 'selectConsole(' + c.consoleId + ')'}">
          <div class="n">🎮 Konsol ${c.consoleId}</div>
          <div class="s">${c.busy ? '🔴 band' : "🟢 bo'sh"}</div>
        </div>
      `).join('');
    }

    function selectConsole(id) {
      selectedConsole = id;
      renderConsoleGrid();
    }
    window.selectConsole = selectConsole;

    async function loadAvailability() {
      const date = document.getElementById('date').value;
      try {
        const res = await fetch('/api/rental-console-availability?date=' + date);
        rentalAvailability = await res.json();
        if (selectedConsole && rentalAvailability.find(c => c.consoleId === selectedConsole && c.busy)) {
          selectedConsole = null;
        }
        renderConsoleGrid();
      } catch (e) {}
    }
    document.getElementById('date').addEventListener('change', () => { selectedConsole = null; loadAvailability(); });
    loadAvailability();

    function updatePrice() {
      const days = Number(document.getElementById('days').value);
      const total = DAILY * days;
      document.getElementById('totalPrice').textContent = total.toLocaleString() + " so'm";
      document.getElementById('prepayPrice').textContent = total.toLocaleString() + " so'm";
    }
    document.getElementById('days').addEventListener('change', updatePrice);
    updatePrice();

    let paymentCardNumber = '';
    let paymentCardOwner = '';
    fetch('/api/payment-info').then(r => r.json()).then(d => {
      paymentCardNumber = d.cardNumber;
      paymentCardOwner = d.cardOwner;
      document.getElementById('cardNumber').textContent = d.cardNumber
        ? d.cardNumber + (d.cardOwner ? ' (' + d.cardOwner + ')' : '')
        : "hali kiritilmagan";
    }).catch(() => { document.getElementById('cardNumber').textContent = '—'; });

    async function submitOrder() {
      const address = document.getElementById('address').value;
      const date = document.getElementById('date').value;
      const startHour = document.getElementById('startHour').value;
      const days = Number(document.getElementById('days').value);
      const hours = days * 24;
      const phone = document.getElementById('phone').value;
      const telegramId = getTelegramId();
      try { sessionStorage.setItem('myPhone', phone); } catch (e) {}

      if (!address || !date || !phone) {
        alert("Iltimos, barcha maydonlarni to'ldiring");
        return;
      }
      if (!selectedConsole) {
        alert("Iltimos, konsolni tanlang");
        return;
      }

      const res = await fetch('/api/rental-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, startHour, hours, address, phone, telegramId, consoleId: selectedConsole })
      });
      const data = await res.json();
      const resultDiv = document.getElementById('result');

      if (data.ok) {
        resultDiv.className = 'result-box';
        resultDiv.innerHTML = `✅ Buyurtma qabul qilindi! #${data.order.id}, Konsol ${data.order.consoleId}<br>
          To'lov: ${data.order.prepay.toLocaleString()} so'm ni <b>${paymentCardNumber || 'ko\'rsatilgan kartaga'}</b>${paymentCardOwner ? ' (' + paymentCardOwner + ')' : ''} o'tkazing va chek screenshotini shu botga yuboring.`;
        loadAvailability();
      } else {
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = data.reason === 'console_busy'
          ? "❌ Bu konsol tanlangan sanada band bo'lib qoldi. Boshqa konsol yoki sana tanlang."
          : "❌ Xatolik yuz berdi. Qayta urinib ko'ring.";
        loadAvailability();
      }
    }
  </script>
</body>
</html>
