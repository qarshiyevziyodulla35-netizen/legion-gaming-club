<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klubga band qilish</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" onclick="return navHash(this)" class="back-link">← Orqaga</a>
    <h1 class="display" style="font-size:22px;margin:0 0 4px;">🏢 Klubga joy band qilish</h1>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 18px;">Konsolni va bo'sh vaqtni o'zingiz tanlaysiz</p>

    <label>Sana</label>
    <input type="date" id="date">

    <label>Konsolni tanlang</label>
    <div id="consoleGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>

    <label>Boshlanish vaqti</label>
    <select id="startHour" disabled></select>
    <p id="scheduleNote" style="font-size:12px;color:var(--text-muted);margin:6px 0 0;">Avval konsol tanlang</p>

    <label>Necha soat</label>
    <select id="hours">
      <option value="1">1 soat</option>
      <option value="2">2 soat</option>
      <option value="3">3 soat</option>
      <option value="4">4 soat</option>
    </select>

    <label>Telefon raqam</label>
    <input type="tel" id="phone" placeholder="+998 90 123 45 67">

    <div class="price-box">
      <div class="row"><span>Jami narx</span><span id="totalPrice">-</span></div>
      <div class="row total"><span>Oldindan to'lov (50%)</span><span id="prepayPrice">-</span></div>
    </div>

    <div class="price-box" style="margin-top:10px;">
      <div class="row"><span>To'lov kartasi</span><span id="cardNumber">yuklanmoqda...</span></div>
    </div>

    <button class="submit-btn" onclick="submitBooking()">Band qilish</button>
    <div id="result"></div>

    <div class="bottom-nav">
      <a href="index.html" onclick="return navHash(this)"><span class="icon">🏠</span>Bosh sahifa</a>
      <a href="club.html" onclick="return navHash(this)" class="active"><span class="icon">🏢</span>Klub</a>
      <a href="rental.html" onclick="return navHash(this)"><span class="icon">🚗</span>Ijara</a>
      <a href="orders.html" onclick="return navHash(this)"><span class="icon">🧾</span>Buyurtmalarim</a>
    </div>
  </div>

  <style>
    .console-card {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }
    .console-card.selected { border-color: var(--gold); background: rgba(242,161,84,0.12); }
    .console-card .n { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .console-card .s { font-size: 11px; color: var(--text-muted); }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      tg.BackButton.show();
      tg.BackButton.onClick(() => { window.location.href = 'index.html' + window.location.hash; });
    }

    // Sahifalar orasida o'tganda Telegram foydalanuvchi ma'lumotini (initData) yo'qotmaslik uchun
    function navHash(el) {
      window.location.href = el.getAttribute('href') + window.location.hash;
      return false;
    }
    function getTelegramId() {
      let id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
      try {
        if (id) sessionStorage.setItem('tgId', id);
        else id = sessionStorage.getItem('tgId');
      } catch (e) {}
      return id;
    }

    const HOURLY = 40000;
    const startHourSel = document.getElementById('startHour');
    for (let h = 9; h <= 22; h++) {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h + ':00';
      startHourSel.appendChild(opt);
    }
    document.getElementById('date').valueAsDate = new Date();

    let consoleSchedule = []; // [{consoleId, busyHours:[...]}]
    let selectedConsole = null;

    function renderConsoleGrid() {
      const grid = document.getElementById('consoleGrid');
      grid.innerHTML = consoleSchedule.map(c => `
        <div class="console-card ${c.consoleId === selectedConsole ? 'selected' : ''}" onclick="selectConsole(${c.consoleId})">
          <div class="n">🎮 Konsol ${c.consoleId}</div>
          <div class="s">${c.busyHours.length ? c.busyHours.length + ' soat band' : "Butun kun bo'sh"}</div>
        </div>
      `).join('');
    }

    function selectConsole(id) {
      selectedConsole = id;
      renderConsoleGrid();
      updateHourOptions();
    }
    window.selectConsole = selectConsole;

    function updateHourOptions() {
      const note = document.getElementById('scheduleNote');
      if (!selectedConsole) {
        startHourSel.disabled = true;
        note.textContent = 'Avval konsol tanlang';
        return;
      }
      startHourSel.disabled = false;
      const c = consoleSchedule.find(x => x.consoleId === selectedConsole);
      const busySet = new Set(c ? c.busyHours : []);
      Array.from(startHourSel.options).forEach(opt => {
        const h = Number(opt.value);
        opt.disabled = busySet.has(h);
        opt.textContent = h + ':00' + (busySet.has(h) ? ' (band)' : '');
      });
      note.textContent = busySet.size
        ? `Konsol ${selectedConsole}ning band soatlari: ${[...busySet].map(h => h + ':00').join(', ')}`
        : `Konsol ${selectedConsole} butun kun bo'sh ✅`;
    }

    async function loadSchedule() {
      const date = document.getElementById('date').value;
      try {
        const res = await fetch('/api/club-console-hours?date=' + date);
        consoleSchedule = await res.json();
        renderConsoleGrid();
        updateHourOptions();
      } catch (e) {
        document.getElementById('scheduleNote').textContent = '';
      }
    }
    document.getElementById('date').addEventListener('change', () => { selectedConsole = null; loadSchedule(); });
    loadSchedule();

    function updatePrice() {
      const hours = Number(document.getElementById('hours').value);
      const total = HOURLY * hours;
      document.getElementById('totalPrice').textContent = total.toLocaleString() + " so'm";
      document.getElementById('prepayPrice').textContent = Math.round(total / 2).toLocaleString() + " so'm";
    }
    document.getElementById('hours').addEventListener('change', updatePrice);
    updatePrice();

    let paymentCardNumber = '';
    let paymentCardOwner = '';
    fetch('/api/payment-info').then(r => r.json()).then(d => {
      paymentCardNumber = d.cardNumber;
      paymentCardOwner = d.cardOwner;
      document.getElementById('cardNumber').textContent = d.cardNumber
        ? d.cardNumber + (d.cardOwner ? ' (' + d.cardOwner + ')' : '')
        : "hali kiritilmagan";
    }).catch(() => { document.getElementById('cardNumber').textContent = '—'; });

    async function submitBooking() {
      const date = document.getElementById('date').value;
      const startHour = document.getElementById('startHour').value;
      const hours = document.getElementById('hours').value;
      const phone = document.getElementById('phone').value;
      const telegramId = getTelegramId();
      try { sessionStorage.setItem('myPhone', phone); } catch (e) {}

      if (!date || !phone) {
        alert("Iltimos, sana va telefon raqamni kiriting");
        return;
      }
      if (!selectedConsole) {
        alert("Iltimos, konsolni tanlang");
        return;
      }

      const res = await fetch('/api/club-booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, startHour, hours, phone, telegramId, consoleId: selectedConsole })
      });
      const data = await res.json();
      const resultDiv = document.getElementById('result');

      if (data.ok) {
        resultDiv.className = 'result-box';
        resultDiv.innerHTML = `✅ Band qilindi! Buyurtma #${data.booking.id}, Konsol ${data.booking.consoleId}<br>
          To'lov: ${data.booking.prepay.toLocaleString()} so'm ni <b>${paymentCardNumber || 'ko\'rsatilgan kartaga'}</b>${paymentCardOwner ? ' (' + paymentCardOwner + ')' : ''} o'tkazing va chek screenshotini shu botga yuboring.`;
        loadSchedule();
      } else {
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = data.reason === 'console_busy'
          ? "❌ Bu konsol tanlangan vaqtda band bo'lib qoldi. Boshqa vaqt yoki konsol tanlang."
          : "❌ Xatolik yuz berdi. Qayta urinib ko'ring.";
        loadSchedule();
      }
    }
  </script>
</body>
</html>
